name: Docker Hub Publish calm-hub

# Fork publishing for krninsky/calm-hub.
# Nightly: after the Calm Hub build succeeds on main.
# Release: tag push vX.Y.Z, calm-hub-v*, or release-*.
# A calm-studio-v* tag does not publish this image.

permissions:
    contents: read

on:
    workflow_run:
        workflows:
            - Build Calm Hub with Integration Tests and Coverage
        types:
            - completed
    push:
        tags:
            - 'v*.*.*'
            - 'calm-hub-v*'
            - 'release-*'
    workflow_dispatch:
        inputs:
            channel:
                description: Tag channel
                type: choice
                default: nightly
                options:
                    - nightly
                    - release
            tag:
                description: Release tag when channel is release (for example v1.2.3)
                required: false
                type: string

concurrency:
    group: dockerhub-publish-calm-hub-${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.event_name }}
    cancel-in-progress: false

jobs:
    calm-hub:
        name: Publish calm-hub
        if: >-
            github.repository == 'krninsky/architecture-as-code' &&
            (
              (
                github.event_name == 'workflow_run' &&
                github.event.workflow_run.conclusion == 'success' &&
                github.event.workflow_run.event == 'push' &&
                github.event.workflow_run.head_branch == 'main' &&
                github.event.workflow_run.head_repository.full_name == github.repository &&
                github.event.workflow_run.name == 'Build Calm Hub with Integration Tests and Coverage'
              ) ||
              (
                github.event_name == 'push' &&
                startsWith(github.ref, 'refs/tags/')
              ) ||
              github.event_name == 'workflow_dispatch'
            )
        runs-on: ubuntu-latest
        timeout-minutes: 120
        env:
            SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ env.SOURCE_SHA }}

            - name: Check Docker Hub credentials
              env:
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              run: |
                  if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
                    echo "Repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are required."
                    exit 1
                  fi

            - name: Resolve image tags
              id: tags
              env:
                  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/calm-hub
                  EVENT_NAME: ${{ github.event_name }}
                  CHANNEL: ${{ github.event.inputs.channel }}
                  INPUT_TAG: ${{ github.event.inputs.tag }}
              run: bash .github/workflows/scripts/dockerhub-tags.sh

            - name: Set up JDK
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Cache Maven dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ~/.m2
                  key: ${{ runner.os }}-m2-${{ hashFiles('calm-hub/pom.xml') }}
                  restore-keys: |
                      ${{ runner.os }}-m2-

            - name: Package CALM Hub
              working-directory: calm-hub
              run: mvn -DskipTests clean package

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

            - name: Login to Docker Hub
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build image for smoke test
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: calm-hub
                  file: calm-hub/src/main/docker/Dockerfile.jvm
                  platforms: linux/amd64
                  load: true
                  tags: calm-hub:smoke
                  cache-from: type=gha,scope=calm-hub
                  cache-to: type=gha,scope=calm-hub,mode=max

            - name: Smoke test
              run: |
                  docker network create smoke-net
                  # mongo:8 exits on GitHub runners: kernel 6.19+ is refused (SERVER-121912).
                  # 7.0 has no such check. The glibc tunable avoids the related tcmalloc crash.
                  docker run -d --name mongo --network smoke-net \
                    -e GLIBC_TUNABLES=glibc.pthread.rseq=1 \
                    mongo:7.0
                  ready=0
                  for _ in $(seq 1 60); do
                    if docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null; then
                      ready=1
                      break
                    fi
                    sleep 2
                  done
                  if [ "$ready" != 1 ]; then
                    docker logs mongo || true
                    echo "MongoDB did not accept a ping"
                    exit 1
                  fi
                  mongo_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' mongo)"
                  test -n "$mongo_ip"
                  docker run -d --name calmhub --network smoke-net \
                    --add-host "mongo:${mongo_ip}" \
                    -p 8080:8080 \
                    -e QUARKUS_MONGODB_CONNECTION_STRING=mongodb://mongo:27017 \
                    -e CALM_AUTH_ENABLED=false \
                    -e QUARKUS_OIDC_TENANT_ENABLED=false \
                    calm-hub:smoke
                  bash calm-hub/smoke-test.sh http://localhost:8080 readwrite

            - name: Dump container logs on failure
              if: failure()
              run: |
                  docker logs mongo 2>/dev/null || true
                  docker logs calmhub 2>/dev/null || true

            - name: Cleanup smoke test containers
              if: always()
              run: |
                  docker rm -f calmhub mongo 2>/dev/null || true
                  docker network rm smoke-net 2>/dev/null || true

            - name: Build and push
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: calm-hub
                  file: calm-hub/src/main/docker/Dockerfile.jvm
                  platforms: linux/amd64,linux/arm64
                  push: true
                  sbom: true
                  provenance: mode=max
                  tags: ${{ steps.tags.outputs.list }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/krninsky/architecture-as-code
                      org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
                  cache-from: type=gha,scope=calm-hub
                  cache-to: type=gha,scope=calm-hub,mode=max
