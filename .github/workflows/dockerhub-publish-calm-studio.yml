name: Docker Hub Publish calm-studio

# Fork publishing for krninsky/calm-studio.
# Nightly: after the CALM Studio build succeeds on main.
# Release: tag push vX.Y.Z, calm-studio-v*, or release-*.
# A calm-hub-v* tag does not publish this image.
# studio-* tags are not in this filter. Publish those with workflow_dispatch.

permissions:
    contents: read

on:
    workflow_run:
        workflows:
            - Build CALM Studio
        types:
            - completed
    push:
        tags:
            - 'v*.*.*'
            - 'calm-studio-v*'
            - 'release-*'
    workflow_dispatch:
        inputs:
            channel:
                description: Tag channel
                type: choice
                default: nightly
                options:
                    - nightly
                    - release
            tag:
                description: Release tag when channel is release (for example studio-2.0.1)
                required: false
                type: string

concurrency:
    group: dockerhub-publish-calm-studio-${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.event_name }}
    cancel-in-progress: false

jobs:
    calm-studio:
        name: Publish calm-studio
        if: >-
            github.repository == 'krninsky/architecture-as-code' &&
            (
              (
                github.event_name == 'workflow_run' &&
                github.event.workflow_run.conclusion == 'success' &&
                github.event.workflow_run.event == 'push' &&
                github.event.workflow_run.head_branch == 'main' &&
                github.event.workflow_run.head_repository.full_name == github.repository &&
                github.event.workflow_run.name == 'Build CALM Studio'
              ) ||
              (
                github.event_name == 'push' &&
                startsWith(github.ref, 'refs/tags/')
              ) ||
              github.event_name == 'workflow_dispatch'
            )
        runs-on: ubuntu-latest
        timeout-minutes: 180
        env:
            SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ env.SOURCE_SHA }}

            - name: Check Docker Hub credentials
              env:
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              run: |
                  if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
                    echo "Repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are required."
                    exit 1
                  fi

            - name: Resolve image tags
              id: tags
              env:
                  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/calm-studio
                  EVENT_NAME: ${{ github.event_name }}
                  CHANNEL: ${{ github.event.inputs.channel }}
                  INPUT_TAG: ${{ github.event.inputs.tag }}
              run: bash .github/workflows/scripts/dockerhub-tags.sh

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

            - name: Login to Docker Hub
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build image for smoke test
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  file: calm-studio/Dockerfile
                  platforms: linux/amd64
                  load: true
                  tags: calm-studio:smoke
                  cache-from: type=gha,scope=calm-studio
                  cache-to: type=gha,scope=calm-studio,mode=max

            - name: Smoke test
              run: |
                  docker run -d --name studio -p 8080:80 calm-studio:smoke
                  for _ in $(seq 1 30); do
                    if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
                      exit 0
                    fi
                    sleep 2
                  done
                  echo "calm-studio did not serve /"
                  exit 1

            - name: Dump container logs on failure
              if: failure()
              run: docker logs studio 2>/dev/null || true

            - name: Cleanup smoke test container
              if: always()
              run: docker rm -f studio 2>/dev/null || true

            - name: Build and push
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  file: calm-studio/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  sbom: true
                  provenance: mode=max
                  tags: ${{ steps.tags.outputs.list }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/krninsky/architecture-as-code
                      org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
                  cache-from: type=gha,scope=calm-studio
                  cache-to: type=gha,scope=calm-studio,mode=max
